#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Keep every property's calendar in step with its Airbnb/Booking/VRBO feed.
  sync_property_icals:
    class: IcalSyncJob
    schedule: every hour at minute 42

  # Take payment for stays reaching their charge date (10 days before check-in).
  # Early morning so a failure leaves the whole day for the guest to react.
  charge_due_bookings:
    class: ChargeDueBookingsJob
    schedule: every day at 6am

  # Release stays whose guest never paid after their card was declined.
  release_unpaid_bookings:
    class: ReleaseUnpaidBookingsJob
    schedule: every day at 7am

  # Pay hosts the day after check-in. Their money is held on the platform until
  # then so a cancellation refund never has to be clawed out of their balance.
  pay_hosts:
    class: HostPayoutsJob
    schedule: every day at 8am
